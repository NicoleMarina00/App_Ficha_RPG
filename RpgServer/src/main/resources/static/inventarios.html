<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventário · RpgServer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-100 antialiased">
  <div id="app"></div>
  <script>
    window.PAGINA = {
      titulo: "Inventário",
      descricao: "Associe armas, armaduras ou escudos a um personagem. Consulte o ID do item na página do respectivo catálogo.",
      endpoint: "/api/inventarios",
      campos: [
        {
          nome: "tipoItem",
          label: "Tipo de item",
          tipo: "select",
          opcoes: [
            { valor: "ARMA", label: "Arma" },
            { valor: "ARMADURA", label: "Armadura" },
            { valor: "ESCUDO", label: "Escudo" }
          ]
        },
        { nome: "itemId", label: "ID no catálogo do tipo selecionado", tipo: "number", obrigatorio: true },
        { nome: "quantidade", label: "Quantidade", tipo: "number", padrao: 1, obrigatorio: true }
      ],
      relacoes: [
        { nome: "personagemId", label: "Personagem", endpoint: "/api/personagens", idOnly: true }
      ]
    };
  </script>
  <script src="/js/ui.js"></script>
</body>
</html>
